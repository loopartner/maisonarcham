<article class="art">
  <header class="a-head">
    <a class="eyebrow muted a-back" href="/journal">← Journal · {{a.category}}</a>
    <h1 class="a-title">{{a.title}}</h1>
    <p class="a-meta"><time datetime="{{a.datetime}}">{{a.date}}</time> · Texte de la Maison · {{a.read}} min de lecture</p>
  </header>
  <figure class="a-hero zoom">
    <img src="{{a.image}}" alt="{{a.imageAlt}}" width="1600" height="800" fetchpriority="high">
    {{a.caption}}
  </figure>
  <div class="a-body">
{{a.body}}
  </div>
</article>
<aside class="a-product">
  <div class="a-product-in">
    <div class="a-product-img"><img src="{{product.image}}" alt="" width="560" height="700" loading="lazy"></div>
    <div class="a-product-text">
      <p class="eyebrow nl-sand">Le parfum de l’article</p>
      <p class="serif a-product-name">{{product.name}}</p>
      <p class="nl-sand a-product-meta">{{product.variant}} · {{product.price}}</p>
      <a class="btn on-dark self-start" href="/parfum">Découvrir le parfum</a>
    </div>
  </div>
</aside>
<section class="band-white">
  <div class="wrap a-related">
    <h2 class="a-related-h">Articles associés</h2>
    <div class="j-grid">
{{a.related}}
    </div>
  </div>
</section>
