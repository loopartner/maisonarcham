<!--meta {"title":"Fiches produits","layout":"admin","adminNav":"produits","scripts":["admin.js","admin-produits.js"],"noindex":true} -->
<header class="adm-head">
  <div><p class="eyebrow muted">Catalogue</p><h1 class="adm-h1">Fiches produits</h1></div>
  <button class="adm-btn primary" type="button" data-new>+ Nouvelle fiche produit</button>
</header>
<div data-publish-bar hidden></div>
<div data-list-view class="adm-stack">
  <div class="kpis" data-kpis></div>
  <section class="panel">
    <div class="adm-table-wrap"><table class="adm-table"><thead><tr><th scope="col">Produit</th><th scope="col">Référence</th><th scope="col">Prix</th><th scope="col">Stock</th><th scope="col">Statut</th><th scope="col">Modifiée</th></tr></thead><tbody data-rows></tbody></table></div>
  </section>
</div>
<form class="adm-stack" data-editor hidden novalidate>
  <div class="adm-row"><button class="linkbtn" type="button" data-back>← Toutes les fiches</button><div class="acct-actions"><a class="adm-btn" href="/parfum" target="_blank" rel="noopener">Prévisualiser</a><button class="adm-btn primary" type="submit">Enregistrer</button></div></div>
  <p class="note error" role="alert" data-error hidden></p>
  <p class="adm-flash" role="status" data-flash hidden></p>
  <div class="adm-2col">
    <section class="panel adm-stack">
      <h2 class="adm-h2">Informations générales</h2>
      <label class="field">Nom du produit *<input class="in" name="name" maxlength="80"><span class="field-err" data-fe="name" hidden></span></label>
      <label class="field">Accroche<input class="in" name="tagline" maxlength="160"></label>
      <label class="field">Description éditoriale<textarea class="in adm-textarea" name="description" rows="5" maxlength="2000"></textarea></label>
      <div class="acct-grid"><label class="field">Famille olfactive<input class="in" name="family" maxlength="120"></label><label class="field">Sillage<input class="in" name="sillage" maxlength="120"></label></div>
      <h2 class="adm-h2">Pyramide olfactive <span class="muted">(notes séparées par des virgules)</span></h2>
      <label class="field">Notes de tête<input class="in" name="top" maxlength="300"></label>
      <label class="field">Notes de cœur<input class="in" name="heart" maxlength="300"></label>
      <label class="field">Notes de fond<input class="in" name="base" maxlength="300"></label>
    </section>
    <div class="adm-stack">
      <section class="panel adm-stack">
        <h2 class="adm-h2">Prix, contenance &amp; stock</h2>
        <div class="acct-grid">
          <label class="field">Prix TTC (€) *<input class="in" name="price" inputmode="decimal"><span class="field-err" data-fe="price" hidden></span></label>
          <label class="field">Prix barré (€)<input class="in" name="comparePrice" inputmode="decimal"><span class="field-err" data-fe="comparePrice" hidden></span></label>
          <label class="field">Type<input class="in" name="kind" maxlength="60"></label>
          <label class="field">Contenance *<input class="in" name="volume" maxlength="20" placeholder="50 ml"><span class="field-err" data-fe="volume" hidden></span></label>
          <label class="field">Référence (SKU) *<input class="in" name="id" maxlength="40"><span class="field-err" data-fe="id" hidden></span></label>
          <label class="field">Statut<select class="in" name="status"><option value="published">Publié</option><option value="draft">Brouillon</option><option value="archived">Archivé</option></select><span class="field-err" data-fe="status" hidden></span></label>
          <label class="field">Stock disponible <span class="muted">(vide = illimité)</span><input class="in" name="stock" inputmode="numeric"><span class="field-err" data-fe="stock" hidden></span></label>
          <label class="field">Seuil d’alerte stock<input class="in" name="stockAlert" inputmode="numeric"><span class="field-err" data-fe="stockAlert" hidden></span></label>
        </div>
      </section>
      <section class="panel adm-stack">
        <h2 class="adm-h2">Galerie photo</h2>
        <p class="adm-muted">Cliquez pour ajouter ou retirer une photo ; la première sert de visuel principal.</p>
        <div class="media-grid" data-media></div>
        <span class="field-err" data-fe="images" hidden></span>
      </section>
      <button class="adm-btn danger self-start" type="button" data-delete hidden>Supprimer la fiche</button>
    </div>
  </div>
</form>
