<!--meta {"title":"Contenu","layout":"admin","adminNav":"contenu","scripts":["admin.js","admin-contenu.js"],"noindex":true} -->
<header class="adm-head">
  <div><p class="eyebrow muted">Éditorial</p><h1 class="adm-h1">Gestion du contenu</h1></div>
  <button class="adm-btn primary" type="button" data-new>+ Nouvel article de blog</button>
</header>
<div data-publish-bar hidden></div>
<div class="adm-stack" data-list-view>
  <section class="panel">
    <h2 class="adm-h2">Articles du Journal</h2>
    <div class="adm-table-wrap"><table class="adm-table"><thead><tr><th scope="col">Titre</th><th scope="col">Catégorie</th><th scope="col">Date</th><th scope="col">Statut</th></tr></thead><tbody data-rows></tbody></table></div>
  </section>
  <div class="adm-2col">
    <form class="panel adm-stack" data-maison novalidate>
      <h2 class="adm-h2">Page La Maison — sections</h2>
      <label class="check"><input type="checkbox" name="histoire"><span>Chapitre I — L’histoire</span></label>
      <label class="check"><input type="checkbox" name="philosophie"><span>Chapitre II — La philosophie</span></label>
      <label class="check"><input type="checkbox" name="savoirfaire"><span>Chapitre III — Le savoir-faire</span></label>
      <label class="check"><input type="checkbox" name="inspirations"><span>Chapitre IV — Les inspirations</span></label>
      <label class="check"><input type="checkbox" name="engagements"><span>Chapitre V — Les engagements</span></label>
      <div class="acct-actions"><button class="adm-btn primary" type="submit">Enregistrer</button><span class="adm-flash" role="status" data-flash hidden></span></div>
    </form>
    <form class="panel adm-stack" data-nl novalidate>
      <h2 class="adm-h2">Bloc newsletter (accueil et page dédiée)</h2>
      <label class="field">Surtitre<input class="in" name="eyebrow" maxlength="60"></label>
      <label class="field">Titre<input class="in" name="title" maxlength="120"></label>
      <label class="field">Texte<textarea class="in adm-textarea adm-textarea-s" name="text" rows="3" maxlength="400"></textarea></label>
      <label class="field">Message de confirmation<input class="in" name="confirm" maxlength="160"></label>
      <div class="acct-actions"><button class="adm-btn primary" type="submit">Enregistrer</button><span class="adm-flash" role="status" data-flash hidden></span></div>
    </form>
  </div>
</div>
<form class="adm-stack" data-editor hidden novalidate>
  <div class="adm-row"><button class="linkbtn" type="button" data-back>← Tous les articles</button><div class="acct-actions"><a class="adm-btn" data-preview target="_blank" rel="noopener" hidden>Voir l’article en ligne</a><button class="adm-btn primary" type="submit">Enregistrer</button></div></div>
  <p class="note error" role="alert" data-error hidden></p>
  <p class="adm-flash" role="status" data-flash hidden></p>
  <div class="adm-2col">
    <section class="panel adm-stack">
      <h2 class="adm-h2">Édition de l’article</h2>
      <label class="field">Titre <span class="muted">(entourez un mot de &lt;em&gt;…&lt;/em&gt; pour l’italique)</span><input class="in" name="title" maxlength="200"><span class="field-err" data-fe="title" hidden></span></label>
      <div class="acct-grid">
        <label class="field">Catégorie<select class="in" name="category" data-cats></select></label>
        <label class="field">Date de publication<input class="in" type="date" name="date"></label>
        <label class="field">Statut<select class="in" name="status"><option value="published">Publié</option><option value="scheduled">Programmé</option><option value="draft">Brouillon</option></select></label>
      </div>
      <label class="check"><input type="checkbox" name="featured"><span>Mettre « à la une » du Journal</span></label>
      <label class="field">Chapô / description<textarea class="in adm-textarea adm-textarea-s" name="excerpt" rows="3" maxlength="300"></textarea><span class="field-err" data-fe="excerpt" hidden></span></label>
      <label class="field">Corps de l’article<textarea class="in adm-textarea adm-textarea-l" name="body" rows="18" maxlength="50000"></textarea><span class="hint">Une ligne vide sépare les paragraphes · « ## » intertitre · « &gt; » citation (« — Auteur » à la ligne) · « [galerie] » galerie photo.</span><span class="field-err" data-fe="body" hidden></span></label>
    </section>
    <section class="panel adm-stack">
      <h2 class="adm-h2">Image principale</h2>
      <div class="media-grid" data-media-main></div>
      <span class="field-err" data-fe="image" hidden></span>
      <label class="field">Texte alternatif (accessibilité)<input class="in" name="imageAlt" maxlength="160"></label>
      <label class="field">Légende<input class="in" name="caption" maxlength="200"></label>
      <h2 class="adm-h2">Galerie <span class="muted">(2 photos conseillées)</span></h2>
      <div class="media-grid" data-media-gallery></div>
      <button class="adm-btn danger self-start" type="button" data-delete hidden>Supprimer l’article</button>
    </section>
  </div>
</form>
