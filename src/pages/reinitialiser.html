<!--meta {"title":"Nouveau mot de passe","scripts":["reinitialiser.js"],"noindex":true} -->
<section class="center-page">
  <form class="form" data-form="reset" novalidate>
    <h1 class="h1-s">Choisir un nouveau mot de passe</h1>
    <p class="lead">Votre nouveau mot de passe remplacera l’ancien et fermera toutes vos sessions ouvertes.</p>
    <div class="field">
      <label for="rs-password">Nouveau mot de passe</label>
      <div class="pwd-wrap">
        <input class="in" id="rs-password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="rs-hint">
        <button class="pwd-toggle" type="button" data-pwd-toggle aria-controls="rs-password" aria-pressed="false" aria-label="Afficher le mot de passe"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10z" stroke="currentColor" stroke-width="1.1"/><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
      <span class="hint" id="rs-hint" data-pwd-hint aria-live="polite">8 caractères minimum, dont un chiffre.</span>
    </div>
    <label class="field" for="rs-confirm">Confirmer le mot de passe<input class="in" id="rs-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required></label>
    <p class="field-err" role="alert" data-error hidden></p>
    <button class="btn" type="submit">Enregistrer le mot de passe</button>
  </form>
</section>
