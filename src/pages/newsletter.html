<!--meta {"title":"La Correspondance","description":"Recevez les lettres de Maison Archam : avant-premières des séries limitées, invitations privées et récits du Journal."} -->
<div class="auth nlp">
  <div class="auth-visual nlp-visual"><img src="/assets/img/creme-ondes.svg" alt="" width="1200" height="1500"></div>
  <div class="auth-panel nlp-panel">
    <p class="eyebrow muted">La Correspondance</p>
    <h1 class="nlp-h">Les lettres de <em>la Maison</em></h1>
    <ul class="nlp-list">
      <li><span class="serif">I</span>Accès en avant-première aux séries limitées</li>
      <li><span class="serif">II</span>Invitations aux rencontres privées de la Maison</li>
      <li><span class="serif">III</span>Les récits du Journal, une fois par mois</li>
    </ul>
    <div class="nlp-done" data-nl-done role="status" tabindex="-1" hidden>
      <p class="serif nlp-done-t" data-nl-done-title>Bienvenue dans la correspondance.</p>
      <p data-nl-done-text></p>
      <button class="txt-btn nlp-reset" type="button" data-nl-reset>Inscrire une autre adresse</button>
    </div>
    <form class="form nlp-form" data-newsletter data-source="page" novalidate>
      <label for="nl" class="eyebrow">Adresse e-mail</label>
      <input id="nl" class="in" name="email" type="email" autocomplete="email" inputmode="email" placeholder="votre@email.com" maxlength="254" required>
      <label class="check"><input type="checkbox" name="consent"><span>J’accepte de recevoir la correspondance de Maison Archam. Désinscription possible à tout moment. <a href="/confidentialite">Politique de confidentialité</a>.</span></label>
      <div class="hp" aria-hidden="true"><label>Site web<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="field-err" role="alert" data-error hidden></p>
      <button class="btn" type="submit">S’inscrire</button>
    </form>
  </div>
</div>
