<header class="hd">
  <div class="hd-bar">
    <div class="hd-left">
      <button class="hd-ico hd-burger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu-mobile" data-menu-open>
        <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M0 1h22M0 7h22M0 13h14" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <a class="hd-logo" href="/">MAISON ARCHAM</a>
    </div>
    <nav class="hd-nav" aria-label="Navigation principale">
      <a href="/"{{nav.accueil}}>Accueil</a>
      <a href="/parfum"{{nav.parfum}}>Le Parfum</a>
      <a href="/journal"{{nav.journal}}>Journal</a>
      <a href="/maison"{{nav.maison}}>La Maison</a>
    </nav>
    <div class="hd-right">
      <a class="hd-ico hd-acc" href="/connexion" aria-label="Mon compte">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="6.5" r="3.6" stroke="currentColor" stroke-width="1.1"/><path d="M3 18c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4" stroke="currentColor" stroke-width="1.1"/></svg>
      </a>
      <a class="hd-ico" href="/panier" aria-label="Panier, 0 article" data-cart-link>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 6.5h13l-1 11h-11z" stroke="currentColor" stroke-width="1.1"/><path d="M7 6.5V5a3 3 0 016 0v1.5" stroke="currentColor" stroke-width="1.1"/></svg>
        <span class="hd-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </div>
  <div class="hd-m" id="menu-mobile" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="hd-m-top">
      <span class="hd-m-logo">MAISON ARCHAM</span>
      <button class="hd-ico" type="button" aria-label="Fermer le menu" data-menu-close>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <nav class="hd-m-nav" aria-label="Menu mobile">
      <a href="/">Accueil</a>
      <a href="/parfum">Le Parfum</a>
      <a href="/journal">Journal</a>
      <a href="/maison">La Maison</a>
    </nav>
    <div class="hd-m-foot">
      <a href="/connexion">Mon compte</a>
      <a href="/newsletter">Newsletter</a>
    </div>
  </div>
</header>
