<div class="cd" data-cart-drawer hidden>
  <button class="cd-overlay" type="button" aria-label="Fermer le panier" data-cart-close tabindex="-1"></button>
  <aside class="cd-panel" role="dialog" aria-modal="true" aria-labelledby="cd-title">
    <div class="cd-head">
      <p class="eyebrow" id="cd-title">Votre panier (<span data-cart-qty>0</span>)</p>
      <button class="hd-ico" type="button" aria-label="Fermer" data-cart-close><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
    <div class="cd-empty" data-cart-empty>
      <p class="serif cd-empty-t">Votre panier attend son parfum.</p>
      <a class="link-ed" href="/parfum">Découvrir {{product.name}}</a>
    </div>
    <div class="cd-filled" data-cart-filled hidden>
      <ul class="cd-lines" data-cart-lines></ul>
      <div class="cd-foot">
        <div class="cd-row"><span>Sous-total</span><span data-cart-subtotal></span></div>
        <div class="cd-row muted cd-small"><span>Livraison</span><span>Offerte</span></div>
        <a class="btn" href="/commande">Procéder au paiement</a>
        <a class="btn ghost" href="/panier">Voir le panier</a>
      </div>
    </div>
  </aside>
</div>
<div class="toast" role="status" aria-live="polite" data-toast hidden></div>
<template id="tpl-cart-line">
  <li class="cd-line">
    <div class="cd-thumb"><img alt="" width="104" height="130" data-l-img></div>
    <div class="cd-info">
      <p class="serif cd-name" data-l-name></p>
      <p class="muted cd-variant" data-l-variant></p>
      <div class="cd-qrow">
        <div class="qty">
          <button class="qbtn" type="button" data-l-dec>−</button>
          <span class="qval" data-l-qty aria-live="polite"></span>
          <button class="qbtn" type="button" data-l-inc>+</button>
        </div>
        <span data-l-total></span>
      </div>
      <button class="txt-btn cd-remove" type="button" data-l-remove>Supprimer</button>
    </div>
  </li>
</template>
